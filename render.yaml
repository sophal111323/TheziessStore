services:
  - type: web
    name: dytopup
    runtime: node
    region: singapore   # closest to Cambodia
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ADMIN_JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false          # set to your Render URL after first deploy
      - key: PAYMENT_SIMULATION_MODE
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TOLA_SAINT_BASE_URL
        value: "https://api.tolasaint.com"
      - key: TOLA_SAINT_API_KEY
        sync: false
      - key: TOLA_SAINT_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INTERNAL_SECURITY_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ORDER_LOOKUP_SECRET
        sync: false          # signs customer order tokens
      - key: FROZENYUKI_WEBHOOK_SECRET
        sync: false          # required: unsigned FrozenYuki webhooks are rejected
      - key: ADMIN_LOGIN_PATH
        sync: false          # long random hidden admin login path
      - key: ORIGIN_SHARED_SECRET
        sync: false          # set ONLY after the Cloudflare x-origin-secret rule exists (DEPLOY.md)
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false          # required in production; re-run setWebhook with secret_token
      - key: KHQRPAY_WEBHOOK_SECRET
        sync: false
      - key: JLA_WEBHOOK_SECRET
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_ALERT_THRESHOLDS
        value: "1K,10K,20K,50K,100K,200K,500K,1M,2M,5M,10M,20M"
      - key: CLOUDFLARE_ALERT_METRIC
        value: "protected"
